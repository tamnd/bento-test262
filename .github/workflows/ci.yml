name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test262:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The results cache is keyed internally per job (bento version + composed
      # source), so restoring a stale one is safe and skips every job whose
      # inputs did not change. The key is unique per run so the grown cache is
      # saved back; restore-keys picks up the newest previous one.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/results-*.ndjson
          key: test262-results-${{ hashFiles('go.sum') }}-${{ github.run_id }}
          restore-keys: |
            test262-results-${{ hashFiles('go.sum') }}-
            test262-results-
      - name: Unit tests
        run: go test -short ./...
      - name: Build
        run: go build -o bin/bento262 ./cmd/bento262
      - name: Run suite against expectations
        run: ./bin/bento262 run
